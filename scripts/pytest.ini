[pytest]
testpaths = sts2_lite agents agent_runner
addopts = -m "not slow"
markers =
    slow: tests that take a second or more (full searches, full runs, many-seed map checks); skipped by default, run them with -m slow
filterwarnings =
    # the paired and order checks fork their replay processes (agents/sts2_MCTS/parallel.py); Python warns about that when the process has
    # other threads. The workers only run pure computation, so it is silenced here. If a check ever hangs, look at this first.
    ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks in the child:DeprecationWarning
